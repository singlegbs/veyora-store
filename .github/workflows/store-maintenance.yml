name: Store maintenance
on:
  push:
    paths: [".github/workflows/store-maintenance.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply authorized store change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          for p in Path('.').rglob('*.html'):
           s=p.read_text()
           s=re.sub(r'<style[^>]*>\s*#pwa-invite[^<]*</style>', '', s)
           s=re.sub(r'<style id="pwa-help-style">[\s\S]*?</style>', '', s)
           s=re.sub(r'<dialog id="pwa-help"[\s\S]*?</dialog>', '', s)
           s=re.sub(r'<aside id="pwa-invite"[\s\S]*?</aside>', '', s)
           s=re.sub(r"  const banner = document.getElementById\('pwa-invite'\);[\s\S]*?(?=\n\}\)\(\);\n</script>)", "  window.addEventListener('beforeinstallprompt', event => event.preventDefault());", s)
           s=re.sub(r'#pwa-invite\{[^}]*\}', '', s)
           p.write_text(s)
          p=Path('manifest.webmanifest');m=json.loads(p.read_text());m.pop('related_applications',None);p.write_text(json.dumps(m,indent=2)+'\n')
          p=Path('sw.js');p.write_text(re.sub(r"const VERSION = .*?;", "const VERSION = 'veyora-pwa-v22-20261122-no-install-prompt';",p.read_text(),count=1))
          PY
          rm .github/workflows/store-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Remove install invitation while preserving browser-menu PWA installation"
          git push origin HEAD:main
