name: Store maintenance
on:
  push:
    paths: [".github/workflows/store-maintenance.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply authorized store change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
           s=re.sub(r'<script data-veyora-pause>[\s\S]*?</script>','',p.read_text());p.write_text(s)
          p=Path('sw.js');p.write_text(re.sub(r"const VERSION = .*?;","const VERSION = 'veyora-pwa-v23-20261122-no-install-prompt-open';",p.read_text(),count=1))
          PY
          rm .github/workflows/store-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Reopen original store without install invitation"
          git push origin HEAD:main
