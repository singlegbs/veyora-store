name: Restore original icon bytes
on:
  push:
    paths: [".github/workflows/restore-original-icons.yml"]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact pre-redesign icons and remove temporary workflow
        run: |
          git restore --source=d7242f26dcbe099db830021e1b4c87796cb259a1 -- icon-512.png icon-512-maskable.png icon-192.png apple-touch-icon.png
          rm .github/workflows/restore-original-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-512.png icon-512-maskable.png icon-192.png apple-touch-icon.png .github/workflows/restore-original-icons.yml
          git commit -m "Revert redesign: restore exact original icon bytes"
          git push origin HEAD:main
